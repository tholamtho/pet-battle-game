<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pet model viewer</title>
    <style>
      html, body { margin: 0; height: 100%; background: #141a2b; color: #eef1fb; font-family: system-ui, sans-serif; overflow: hidden; }
      #stage { position: fixed; inset: 0 0 0 320px; }
      #stage canvas { display: block; width: 100%; height: 100%; }
      #panel { position: fixed; inset: 0 auto 0 0; width: 320px; padding: 14px; overflow-y: auto; background: #101526; border-right: 1px solid rgba(255,255,255,.12); font-size: 14px; }
      #panel h1 { font-size: 16px; margin: 0 0 8px; }
      #panel h2 { font-size: 13px; margin: 16px 0 6px; color: #98a2c3; font-weight: 600; }
      #panel button, #panel select { font: inherit; padding: 7px 10px; margin: 0 6px 6px 0; border-radius: 8px; border: 1px solid rgba(255,255,255,.18); background: #1b2238; color: inherit; cursor: pointer; }
      #panel select { width: 100%; margin-bottom: 8px; }
      #panel button:hover { background: #26304f; }
      .hint { color: #98a2c3; line-height: 1.5; }
      .ok { color: #5fd38d; } .no { color: #f2c14e; }
      table { border-collapse: collapse; width: 100%; } td { padding: 3px 0; vertical-align: top; }
      #drop { position: fixed; inset: 0 0 0 320px; display: none; place-items: center; background: rgba(20,26,43,.8); font-size: 20px; border: 3px dashed #4aa8ff; }
      @media (max-width: 700px) { #stage, #drop { inset: 0; } #panel { width: 100%; height: 45%; inset: auto 0 0 0; } }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <div id="panel"></div>
    <div id="drop">Drop model.glb and/or config.json</div>
    <script type="module" src="/src/viewer/main.js"></script>
  </body>
</html>
