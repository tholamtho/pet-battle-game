services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pets
      POSTGRES_PASSWORD: pets
      POSTGRES_DB: pets
    ports: ['5432:5432']
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pets -d pets']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    depends_on:
      db: { condition: service_healthy }
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://pets:pets@db:5432/pets
      JWT_SECRET: dev-only-secret-change-me-please
      CORS_ORIGIN: http://localhost:5173
    ports: ['3000:3000']

volumes:
  pgdata:
